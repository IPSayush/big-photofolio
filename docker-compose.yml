# Docker Compose for local development
# Runs MongoDB, Redis, and the worker service

version: '3.8'

services:
  # MongoDB — database
  mongodb:
    image: mongo:7
    container_name: photofolio-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis — BullMQ queue backend
  redis:
    image: redis:7-alpine
    container_name: photofolio-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Worker service — BullMQ consumers
  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    container_name: photofolio-worker
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/photofolio
      - REDIS_URL=redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
